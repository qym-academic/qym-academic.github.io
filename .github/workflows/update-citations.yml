name: Update Google Scholar Citations

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCHOLAR_PROFILE_CACHE: /tmp/scholar-profile-${{ github.run_id }}.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Scholar dependency compatibility
        run: |
          python -m pip check
          python -c "from bs4 import BeautifulSoup; print('Scholar profile parser imports OK')"

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        continue-on-error: true
        run: python bin/run_scholar_update.py bin/update_scholar_citations.py --timeout 180

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Test publication synchronization
        run: python -m unittest discover -s test -p 'test_scholar*.py'

      - name: Synchronize journal and conference publications
        id: publications
        continue-on-error: true
        run: python bin/run_scholar_update.py bin/update_scholar_publications.py --timeout 300

      - name: Commit and push if changed
        run: |
          git add _data/citations.yml _pages/publications.md
          if git diff --staged --quiet; then
            echo "ℹ️ No citation changes to publish."
          else
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations and publications"
            git pull --rebase
            git push
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi

      - name: Report unexpected Scholar update failure
        if: steps.publications.outcome == 'failure' || steps.run_citation_update.outcome == 'failure'
        run: |
          echo "A parser, dependency, or other non-network error prevented an update. See the diagnostics above; successful independent updates may still be published." >> "$GITHUB_STEP_SUMMARY"
          exit 1
